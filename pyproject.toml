[build-system]
# Pinned so two builds on different days use the same backend (PEP 639 licence
# metadata needs setuptools 77 or newer). Update the pin deliberately.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paracortex"
version = "0.6.0"
authors = [{name = "solisolsoli"}]
description = "Local context and memory for AI agents: source-linked retrieval from Markdown and Obsidian, with MCP and optional GitHub sources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "retrieval-patches/LICENSE.upstream.txt"]
keywords = ["obsidian", "obsidian-plugin", "markdown", "retrieval", "context", "mcp", "claude-code", "knowledge-base", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Text Processing :: Indexing",
]
# Runtime dependencies: none, deliberately. The router, the indexer and the
# evaluation harness are Python standard library only (sqlite3 + FTS5).
dependencies = []

[project.urls]
Homepage = "https://github.com/solisolsoli/paracortex"
Documentation = "https://github.com/solisolsoli/paracortex/blob/main/docs/README.md"
Source = "https://github.com/solisolsoli/paracortex"
Changelog = "https://github.com/solisolsoli/paracortex/blob/main/CHANGELOG.md"
Security = "https://github.com/solisolsoli/paracortex/security/policy"

[project.scripts]
paracortex = "paracortex.cli:main"
# The 0.5 name, kept for one release: prints one line naming `paracortex`, then runs it.
context-layer = "paracortex.cli:legacy_main"

[tool.setuptools]
packages = [
  "paracortex", "paracortex.router", "paracortex.eval", "paracortex.eval.adapters",
  "paracortex.eval.comparison", "paracortex.eval.fixtures", "paracortex.eval.fixtures.docs",
  "paracortex.templates", "paracortex.templates.vault", "paracortex.data",
  # Deprecated import shim for the 0.5 package name; removed in a later release.
  "context_layer",
]

[tool.setuptools.package-dir]
"paracortex" = "paracortex"
"paracortex.router" = "router"
"paracortex.eval" = "eval"
"paracortex.eval.adapters" = "eval/adapters"
"paracortex.eval.fixtures" = "eval/fixtures"
"paracortex.eval.comparison" = "eval/comparison"
"paracortex.eval.fixtures.docs" = "eval/fixtures/docs"
"paracortex.templates" = "templates"
"paracortex.templates.vault" = "templates/vault"
"paracortex.data" = "paracortex/data"
"context_layer" = "context_layer"

[tool.setuptools.package-data]
"paracortex.data" = ["*.md"]
"paracortex.router" = ["*.md", "*.json", "example-vault/.context/routes.json", "example-vault/.context/facts.json", "example-vault/**/*.md"]
"paracortex.eval" = ["*.md", "*.json", "*.jsonl"]
"paracortex.eval.comparison" = ["*.md", "*.json", "*.jsonl"]
"paracortex.eval.fixtures.docs" = ["*.md"]
"paracortex.templates.vault" = ["*.md"]
"paracortex.templates" = ["starter-brain/*.md", "starter-brain/*/*.md", "starter-brain/obsidian/*.json"]
